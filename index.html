<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropLife Brasil</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Loading screen -->
  <div class="loading-screen" id="loadingScreen">
    <img class="loading-logo" src="Img/LOGO%201.png" alt="DropLife" />
    <div class="loading-bar"></div>
    <span class="loading-text">Carregando Brasil&hellip;</span>
  </div>

  <div class="frame">
    <div class="game-logo">
      <img src="Img/LOGO%201.png" alt="DropLife logo" />
    </div>

    <div class="controls bottom-bar" role="navigation" aria-label="Menu principal">

      <button class="nav-btn ui-btn" type="button">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="btn-label">Populacao</span>
      </button>

      <button class="nav-btn ui-btn" type="button">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="btn-label">Citydex</span>
      </button>

      <button id="birthBtn" type="button">
        <span class="btn-label">Nascer</span>
      </button>

      <button class="nav-btn ui-btn" type="button">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        <span class="btn-label">Estados</span>
      </button>

      <button class="nav-btn ui-btn" type="button">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="7"/>
          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
        </svg>
        <span class="btn-label">Conquistas</span>
      </button>

    </div>

    <div class="map-wrap" id="mapContainer"></div>
  </div>

  <!-- Tooltip -->
  <div id="cityTooltip" class="city-tooltip hidden" aria-live="polite" aria-hidden="true">
    <div class="city-tooltip__header">
      <div class="city-tooltip__title" id="tooltipTitle"></div>
      <div class="city-tooltip__actions">
        <button class="city-tooltip__btn city-tooltip__btn--info" id="tooltipInfo"
                type="button" aria-label="Detalhes do municipio">i</button>
        <button class="city-tooltip__btn city-tooltip__btn--close" id="tooltipClose"
                type="button" aria-label="Fechar">&#x2715;</button>
      </div>
    </div>
    <div class="city-tooltip__subtitle" id="tooltipSubtitle"></div>
  </div>

  <button id="zoomReset" class="zoom-reset" type="button">Voltar</button>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes do municipio</h2>
        <button id="modalClose" class="modal-close" type="button">Fechar</button>
      </div>
      <div class="modal-body">
        <p id="modalMessage" class="modal-message"></p>
        <div class="modal-city hidden" id="modalCity">
          <p class="modal-city__meta" id="modalCityMeta"></p>
          <p class="modal-city__chance hidden" id="modalCityChance"></p>
          <p class="modal-city__curiosity" id="modalCityCuriosity"></p>
          <p class="modal-city__placeholder">Mais dados em breve&hellip;</p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
