<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DropLife — Protótipo Canvas</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff8e9; font-family: 'Segoe UI', system-ui, sans-serif; }
  #map { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 5;
    background: rgba(255, 255, 255, 0.92); border: 1px solid #f0e4c4; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: #5c5643; max-width: 260px;
    box-shadow: 0 8px 24px rgba(60, 50, 20, 0.15);
  }
  #hud h1 { margin: 0 0 6px; font-size: 13px; color: #2e2a1f; }
  #hud table { border-collapse: collapse; }
  #hud td { padding: 1px 6px 1px 0; }
  #hud td:last-child { font-weight: 700; color: #2e2a1f; font-variant-numeric: tabular-nums; }
  #hud .dica { margin: 8px 0 0; font-size: 11px; color: #948d76; }
  #fps { color: #3ca002; }
  #tooltip {
    position: fixed; z-index: 6; pointer-events: none; display: none;
    background: #2e2a1f; color: #fff; font-size: 12px; font-weight: 700;
    padding: 6px 10px; border-radius: 8px; transform: translate(-50%, -140%);
    white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
</style>
</head>
<body>
<div id="hud">
  <h1>🧪 Protótipo Canvas (1 nó DOM)</h1>
  <table>
    <tr><td>Download do mapa</td><td id="mFetch">…</td></tr>
    <tr><td>Parse + Path2D</td><td id="mParse">…</td></tr>
    <tr><td>Raster completo</td><td id="mRaster">…</td></tr>
    <tr><td>Hit-test (hover)</td><td id="mHit">…</td></tr>
    <tr><td>FPS no gesto</td><td id="fps">—</td></tr>
    <tr><td>Nós de mapa no DOM</td><td>1 (vs 5.598)</td></tr>
  </table>
  <p class="dica">Arraste para mover · roda/pinça para zoom · toque/hover mostra a cidade · clique “captura” (cor de raridade)</p>
</div>
<div id="tooltip"></div>
<canvas id="map"></canvas>
<script>
(async () => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const ms = (v) => `${v.toFixed(0)} ms`;

  // ── Dados ──
  const t0 = performance.now();
  const svgText = await (await fetch('/MAPAESTADOS.svg')).text();
  const tFetch = performance.now();
  $('mFetch').textContent = ms(tFetch - t0);

  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const normalize = (v = '') => v.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
  const keyFor = (c, s) => `${normalize(c)}-${normalize(s)}`;
  const CAPITAIS = new Set(Object.entries({
    AC: 'Rio Branco', AL: 'Maceio', AP: 'Macapa', AM: 'Manaus', BA: 'Salvador',
    CE: 'Fortaleza', DF: 'Brasilia', ES: 'Vitoria', GO: 'Goiania', MA: 'Sao Luis',
    MT: 'Cuiaba', MS: 'Campo Grande', MG: 'Belo Horizonte', PA: 'Belem',
    PB: 'Joao Pessoa', PR: 'Curitiba', PE: 'Recife', PI: 'Teresina',
    RJ: 'Rio de Janeiro', RN: 'Natal', RS: 'Porto Alegre', RO: 'Porto Velho',
    RR: 'Boa Vista', SC: 'Florianopolis', SP: 'Sao Paulo', SE: 'Aracaju', TO: 'Palmas',
  }).map(([uf, c]) => keyFor(c, uf)));

  const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
  const TONES = ['#1b5438', '#20603f', '#16482c'];
  const RARIDADES = [
    { cor: '#f59e0b', nome: 'Lendário' }, { cor: '#a78bfa', nome: 'Épico' },
    { cor: '#38bdf8', nome: 'Raro' }, { cor: '#34d399', nome: 'Incomum' }, { cor: '#94a3b8', nome: 'Comum' },
  ];

  const cities = [];
  doc.querySelectorAll('path[data-name]').forEach((n) => {
    const raw = n.getAttribute('data-name') || '';
    const [nome = '', ufRaw = ''] = raw.split(',').map((s) => s.trim());
    const uf = ufRaw.toUpperCase();
    if (!nome || !UFS.includes(uf)) return;
    cities.push({ nome, uf, key: keyFor(nome.replace(/\s+\d+$/, ''), uf), path: new Path2D(n.getAttribute('d')), captured: null });
  });
  const borders = [...doc.querySelectorAll('path[id^="state-border"]')].map((n) => new Path2D(n.getAttribute('d')));

  // Mega-paths por tom (o segredo do raster rápido: 3 fills em vez de 5.570)
  const tonePaths = TONES.map(() => new Path2D());
  const capitalPath = new Path2D();
  const allStrokes = new Path2D();
  const toneOf = (uf) => UFS.indexOf(uf) % 3;
  cities.forEach((c) => {
    (CAPITAIS.has(c.key) ? capitalPath : tonePaths[toneOf(c.uf)]).addPath(c.path);
    allStrokes.addPath(c.path);
  });
  const tParse = performance.now();
  $('mParse').textContent = `${ms(tParse - tFetch)} · ${cities.length} cidades`;

  // ── Câmera / canvas ──
  const canvas = $('map');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const cam = { scale: 1, tx: 0, ty: 0 };

  const resize = () => {
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    cache.stale = true; draw();
  };

  const fit = () => {
    cam.scale = Math.min(W, H) / 680 * 0.95;
    cam.tx = (W - 680 * cam.scale) / 2;
    cam.ty = (H - 680 * cam.scale) / 2;
  };

  // ── Render ──
  const cache = { bmp: null, scale: 0, tx: 0, ty: 0, stale: true };

  const rasterFull = () => {
    const t = performance.now();
    const off = cache.bmp && cache.bmp.width === canvas.width ? cache.bmp : document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const c = off.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    c.translate(cam.tx, cam.ty);
    c.scale(cam.scale, cam.scale);
    // forro
    c.fillStyle = '#14432c';
    borders.forEach((b) => c.fill(b));
    // tons por estado (3 fills!)
    tonePaths.forEach((p, i) => { c.fillStyle = TONES[i]; c.fill(p); });
    // capitais douradas
    c.fillStyle = '#dda824'; c.fill(capitalPath);
    // capturadas (cor da raridade)
    cities.forEach((ct) => { if (ct.captured) { c.fillStyle = ct.captured.cor; c.fill(ct.path); } });
    // divisas (1 stroke só)
    c.strokeStyle = 'rgba(8, 40, 24, 0.6)'; c.lineWidth = 0.3; c.stroke(allStrokes);
    cache.bmp = off; cache.scale = cam.scale; cache.tx = cam.tx; cache.ty = cam.ty; cache.stale = false;
    $('mRaster').textContent = ms(performance.now() - t);
  };

  let hovered = null;
  const draw = () => {
    if (cache.stale) rasterFull();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // bitmap reprojetado (pan/zoom liso mesmo no celular)
    const k = cam.scale / cache.scale;
    ctx.drawImage(cache.bmp, (cam.tx - cache.tx * k) * dpr, (cam.ty - cache.ty * k) * dpr, canvas.width * k, canvas.height * k);
    if (hovered) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.translate(cam.tx, cam.ty); ctx.scale(cam.scale, cam.scale);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; ctx.fill(hovered.path);
    }
  };

  let rerasterTimer = 0;
  const scheduleReraster = () => {
    clearTimeout(rerasterTimer);
    rerasterTimer = setTimeout(() => { cache.stale = true; draw(); }, 140);
  };

  // ── FPS ──
  let frames = 0, fpsStart = 0, fpsTimer = 0;
  const tickFps = () => {
    const now = performance.now();
    if (!fpsStart) { fpsStart = now; frames = 0; }
    frames++;
    if (now - fpsStart >= 500) {
      $('fps').textContent = `${Math.round(frames / ((now - fpsStart) / 1000))}`;
      fpsStart = now; frames = 0;
    }
    clearTimeout(fpsTimer);
    fpsTimer = setTimeout(() => { fpsStart = 0; }, 300);
  };

  // ── Hit-test ──
  const hitTest = (mx, my) => {
    const t = performance.now();
    const x = (mx - cam.tx) / cam.scale;
    const y = (my - cam.ty) / cam.scale;
    let hit = null;
    for (let i = 0; i < cities.length; i++) {
      if (ctx.isPointInPath(cities[i].path, x, y)) { hit = cities[i]; break; }
    }
    $('mHit').textContent = ms(performance.now() - t);
    return hit;
  };

  const tooltip = $('tooltip');
  const showTip = (city, cx, cy) => {
    if (!city) { tooltip.style.display = 'none'; return; }
    tooltip.textContent = city.captured ? `${city.nome} (${city.uf}) — ${city.captured.nome}` : `${city.nome} (${city.uf})`;
    tooltip.style.display = 'block';
    tooltip.style.left = `${cx}px`; tooltip.style.top = `${cy}px`;
  };

  // ── Gestos ──
  let dragging = false, moved = false, lastX = 0, lastY = 0;
  let pinch = null;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging && !pinch) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      cam.tx += dx; cam.ty += dy; lastX = e.clientX; lastY = e.clientY;
      draw(); tickFps(); scheduleReraster();
    } else if (!dragging && e.pointerType === 'mouse') {
      hovered = hitTest(e.clientX, e.clientY);
      showTip(hovered, e.clientX, e.clientY);
      draw();
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false; canvas.classList.remove('dragging');
    if (!moved && !pinch) {
      const hit = hitTest(e.clientX, e.clientY);
      if (hit) {
        hit.captured = hit.captured ? null : RARIDADES[Math.floor(Math.random() * RARIDADES.length)];
        cache.stale = true; draw();
        showTip(hit, e.clientX, e.clientY);
      }
    }
    pinch = null;
  });

  const zoomAt = (mx, my, factor) => {
    const next = Math.max(0.5, Math.min(40, cam.scale * factor));
    const k = next / cam.scale;
    cam.tx = mx - (mx - cam.tx) * k;
    cam.ty = my - (my - cam.ty) * k;
    cam.scale = next;
    draw(); tickFps(); scheduleReraster();
  };

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const [a, b] = e.touches;
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const [a, b] = e.touches;
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, d / pinch.d);
      pinch.d = d;
    }
  }, { passive: false });

  // ── Boot ──
  window.addEventListener('resize', resize);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  fit();
  draw();
})();
</script>
</body>
</html>
