<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DropLife — Teste de Voz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #fff8e9; font-family: 'Segoe UI', system-ui, sans-serif; color: #5c5643; padding: 16px;
  }
  .card {
    background: #fff; border: 1px solid #f0e4c4; border-radius: 12px; padding: 22px;
    max-width: 480px; width: 100%; box-shadow: 0 14px 36px rgba(60, 50, 20, 0.12);
  }
  h1 { margin: 0 0 4px; font-size: 18px; color: #2e2a1f; }
  p.sub { margin: 0 0 16px; font-size: 12px; color: #948d76; }
  label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #948d76; margin: 12px 0 4px; }
  select, textarea {
    width: 100%; font-family: inherit; font-size: 13px; color: #2e2a1f;
    background: #fffdf5; border: 1px solid #f0e4c4; border-radius: 8px; padding: 9px 10px;
  }
  textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
  .linha { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: #58cc02; }
  .val { width: 44px; text-align: right; font-size: 12px; font-weight: 700; }
  .acoes { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1; padding: 13px; border: none; border-radius: 8px; font-family: inherit;
    font-size: 14px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
  }
  #falar { background: #58cc02; color: #fff; box-shadow: 0 4px 0 #3ca002; }
  #falar:active { transform: translateY(3px); box-shadow: 0 1px 0 #3ca002; }
  #parar { background: #fff; color: #ff4b4b; border: 1px solid rgba(255,75,75,.35); flex: 0 0 auto; padding: 13px 18px; }
  #sortear { background: #fff; color: #0d8fce; border: 1px solid #cde8f7; flex: 0 0 auto; padding: 13px 14px; }
  .aviso { margin-top: 12px; font-size: 11px; color: #948d76; }
</style>
</head>
<body>
<div class="card">
  <h1>🔊 Teste de voz (Web Speech API)</h1>
  <p class="sub">É a voz nativa do navegador — a mesma que o jogo usaria para ler as curiosidades. Grátis, sem servidor.</p>

  <label for="voz">Voz (as pt-BR do seu aparelho)</label>
  <select id="voz"></select>

  <label for="texto">Curiosidade</label>
  <textarea id="texto">Juiz de Fora, Minas Gerais: berço de grandes artistas, intelectuais e da primeira usina elétrica de porte da América do Sul.</textarea>

  <label>Velocidade</label>
  <div class="linha">
    <input type="range" id="vel" min="60" max="140" value="100">
    <span class="val" id="velVal">1.0x</span>
  </div>

  <div class="acoes">
    <button id="falar" type="button">▶ Falar</button>
    <button id="sortear" type="button" title="Outra curiosidade">🎲</button>
    <button id="parar" type="button">■</button>
  </div>
  <p class="aviso" id="aviso"></p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  if (!('speechSynthesis' in window)) {
    $('aviso').textContent = '❌ Este navegador não tem síntese de voz.';
    $('falar').disabled = true;
    return;
  }

  const AMOSTRAS = [
    'Juiz de Fora, Minas Gerais: berço de grandes artistas, intelectuais e da primeira usina elétrica de porte da América do Sul.',
    'Serra da Saudade, Minas Gerais: o município menos populoso do Brasil, com cerca de oitocentos habitantes — nascer aqui é lendário!',
    'Belém, Pará: portal da Amazônia, famosa pelo mercado Ver-o-Peso e pelo Círio de Nazaré, uma das maiores procissões religiosas do mundo.',
    'Fernando de Noronha, Pernambuco: arquipélago paradisíaco, patrimônio mundial da UNESCO e santuário de golfinhos e tartarugas.',
    'Piranhas, Goiás: cidade histórica banhada pelo rio Piranhas — e não, a foto não é de um peixe.',
  ];
  let amostra = 0;

  const carregaVozes = () => {
    const vozes = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('pt'));
    const sel = $('voz');
    sel.innerHTML = '';
    (vozes.length ? vozes : speechSynthesis.getVoices()).forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})${v.localService ? '' : ' · online'}`;
      sel.appendChild(opt);
    });
    $('aviso').textContent = vozes.length
      ? `✅ ${vozes.length} voz(es) em português neste aparelho.`
      : '⚠️ Nenhuma voz pt encontrada — mostrando todas.';
  };
  carregaVozes();
  speechSynthesis.onvoiceschanged = carregaVozes;

  $('vel').addEventListener('input', () => {
    $('velVal').textContent = ($('vel').value / 100).toFixed(1) + 'x';
  });

  $('falar').addEventListener('click', () => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance($('texto').value);
    u.lang = 'pt-BR';
    u.rate = $('vel').value / 100;
    const voz = speechSynthesis.getVoices().find((v) => v.name === $('voz').value);
    if (voz) u.voice = voz;
    speechSynthesis.speak(u);
  });

  $('parar').addEventListener('click', () => speechSynthesis.cancel());

  $('sortear').addEventListener('click', () => {
    amostra = (amostra + 1) % AMOSTRAS.length;
    $('texto').value = AMOSTRAS[amostra];
  });
})();
</script>
</body>
</html>
